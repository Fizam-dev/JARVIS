<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. — Just A Rather Very Intelligent System</title>
    <meta name="description" content="JARVIS AI Assistant — Voice-controlled, inspired by Tony Stark's AI">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap"
        rel="stylesheet">
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.154.0/examples/jsm/"
            }
        }
    </script>
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --j-blue: #4fc3f7;
            --j-core: #b3e5fc;
            --j-glow: #00b0ff;
            --j-cyan: #00e5ff;
            --j-dim: #0d2137;
            --j-dark: #020810;
            --j-listen: #00e676;
            --j-speak: #40c4ff;
            --j-error: #ff5252;
        }

        body {
            overflow: hidden;
            background: var(--j-dark);
            font-family: 'Rajdhani', 'Segoe UI', sans-serif;
            cursor: default;
            user-select: none;
            width: 100vw;
            height: 100vh;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* ═══ Boot Overlay ═══ */
        #boot-overlay {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--j-dark);
            transition: opacity 1.4s ease;
            cursor: pointer;
        }

        #boot-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .boot-rings {
            position: relative;
            width: 100px;
            height: 100px;
            margin-bottom: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .boot-ring-outer {
            position: absolute;
            width: 100px;
            height: 100px;
            border: 2px solid transparent;
            border-top-color: var(--j-blue);
            border-right-color: rgba(79, 195, 247, 0.2);
            border-radius: 50%;
            animation: spin 1.2s linear infinite;
        }

        .boot-ring-mid {
            position: absolute;
            width: 72px;
            height: 72px;
            border: 1.5px solid transparent;
            border-bottom-color: var(--j-cyan);
            border-left-color: rgba(0, 229, 255, 0.2);
            border-radius: 50%;
            animation: spin 0.8s linear infinite reverse;
        }

        .boot-ring-inner {
            position: absolute;
            width: 44px;
            height: 44px;
            border: 1px solid transparent;
            border-top-color: var(--j-core);
            border-radius: 50%;
            animation: spin 0.5s linear infinite;
        }

        .boot-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--j-cyan);
            box-shadow: 0 0 12px var(--j-cyan), 0 0 30px rgba(0, 229, 255, 0.3);
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .boot-title {
            font-family: 'Orbitron', monospace;
            color: var(--j-blue);
            font-size: 16px;
            letter-spacing: 8px;
            text-transform: uppercase;
            animation: pulse 2s ease-in-out infinite;
        }

        .boot-sub {
            color: rgba(79, 195, 247, 0.35);
            font-size: 11px;
            letter-spacing: 5px;
            margin-top: 10px;
            font-family: 'Share Tech Mono', monospace;
        }

        .boot-click {
            color: rgba(79, 195, 247, 0.5);
            font-size: 12px;
            letter-spacing: 3px;
            margin-top: 40px;
            animation: pulse 1.5s ease-in-out infinite;
            font-family: 'Rajdhani', sans-serif;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.4;
            }

            50% {
                opacity: 1;
            }
        }

        /* ═══ JARVIS Title ═══ */
        #jarvis-title {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            opacity: 0;
            transition: opacity 2.5s ease;
        }

        #jarvis-title.visible {
            opacity: 1;
        }

        .jarvis-name {
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: clamp(36px, 7vw, 100px);
            letter-spacing: clamp(10px, 2.5vw, 36px);
            color: transparent;
            background: linear-gradient(180deg,
                    rgba(255, 255, 255, 0.95) 0%, var(--j-core) 35%,
                    var(--j-blue) 65%, rgba(0, 176, 255, 0.5) 100%);
            background-clip: text;
            -webkit-background-clip: text;
            filter: drop-shadow(0 0 25px rgba(79, 195, 247, 0.4));
            animation: nameBreath 4s ease-in-out infinite;
        }

        .jarvis-sub {
            font-family: 'Share Tech Mono', monospace;
            font-weight: 400;
            font-size: clamp(7px, 1.2vw, 12px);
            letter-spacing: clamp(3px, 1vw, 10px);
            color: rgba(79, 195, 247, 0.35);
            text-transform: uppercase;
            margin-top: 10px;
            animation: subFlick 5s ease-in-out infinite;
        }

        @keyframes nameBreath {

            0%,
            100% {
                filter: drop-shadow(0 0 20px rgba(79, 195, 247, 0.25));
                opacity: 0.8;
            }

            50% {
                filter: drop-shadow(0 0 50px rgba(79, 195, 247, 0.55));
                opacity: 1;
            }
        }

        @keyframes subFlick {

            0%,
            100% {
                opacity: 0.25;
            }

            40% {
                opacity: 0.4;
            }

            60% {
                opacity: 0.35;
            }
        }

        /* ═══ Status & Transcript ═══ */
        #status-bar {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            text-align: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        #status-bar.visible {
            opacity: 1;
        }

        #status-state {
            font-family: 'Orbitron', monospace;
            font-size: 10px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--j-blue);
            transition: color 0.5s ease;
        }

        #status-state.listening {
            color: var(--j-listen);
        }

        #status-state.speaking {
            color: var(--j-speak);
        }

        #status-state.error {
            color: var(--j-error);
        }

        .mic-indicator {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-right: 8px;
            background: var(--j-blue);
            transition: all 0.5s ease;
            vertical-align: middle;
        }

        .mic-indicator.listening {
            background: var(--j-listen);
            box-shadow: 0 0 12px var(--j-listen);
            animation: micPulse 1s ease-in-out infinite;
        }

        .mic-indicator.speaking {
            background: var(--j-speak);
            box-shadow: 0 0 12px var(--j-speak);
        }

        @keyframes micPulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.6);
            }
        }

        #transcript {
            position: fixed;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            text-align: center;
            max-width: 80vw;
            width: 600px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1s ease;
        }

        #transcript.visible {
            opacity: 1;
        }

        #user-text {
            font-family: 'Share Tech Mono', monospace;
            font-size: 13px;
            color: rgba(0, 229, 255, 0.6);
            letter-spacing: 1px;
            margin-bottom: 6px;
            min-height: 18px;
        }

        #jarvis-text {
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            font-weight: 500;
            color: rgba(179, 229, 252, 0.85);
            letter-spacing: 0.5px;
            min-height: 22px;
            line-height: 1.4;
        }

        /* ═══ HUD Elements ═══ */
        .hud-ring {
            position: fixed;
            top: 50%;
            left: 50%;
            border-radius: 50%;
            border: 1px solid rgba(79, 195, 247, 0.06);
            pointer-events: none;
            z-index: 5;
            opacity: 0;
            transition: opacity 2s ease;
        }

        .hud-ring.visible {
            opacity: 1;
        }

        .hud-r1 {
            width: 300px;
            height: 300px;
            margin: -150px 0 0 -150px;
            animation: hudR 55s linear infinite;
            border-color: rgba(79, 195, 247, 0.05);
        }

        .hud-r2 {
            width: 440px;
            height: 440px;
            margin: -220px 0 0 -220px;
            animation: hudR 80s linear infinite reverse;
            border-style: dashed;
            border-color: rgba(79, 195, 247, 0.035);
        }

        .hud-r3 {
            width: 580px;
            height: 580px;
            margin: -290px 0 0 -290px;
            animation: hudR 110s linear infinite;
            border-color: rgba(79, 195, 247, 0.025);
        }

        @keyframes hudR {
            to {
                transform: rotate(360deg);
            }
        }

        .hud-corner {
            position: fixed;
            width: 40px;
            height: 40px;
            z-index: 20;
            pointer-events: none;
            opacity: 0;
            transition: opacity 2s ease 0.8s;
        }

        .hud-corner.visible {
            opacity: 0.25;
        }

        .hc-tl {
            top: 16px;
            left: 16px;
            border-top: 1px solid var(--j-blue);
            border-left: 1px solid var(--j-blue);
        }

        .hc-tr {
            top: 16px;
            right: 16px;
            border-top: 1px solid var(--j-blue);
            border-right: 1px solid var(--j-blue);
        }

        .hc-bl {
            bottom: 16px;
            left: 16px;
            border-bottom: 1px solid var(--j-blue);
            border-left: 1px solid var(--j-blue);
        }

        .hc-br {
            bottom: 16px;
            right: 16px;
            border-bottom: 1px solid var(--j-blue);
            border-right: 1px solid var(--j-blue);
        }

        .scanlines {
            position: fixed;
            inset: 0;
            z-index: 50;
            pointer-events: none;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 0, 0, 0.02) 2px, rgba(0, 0, 0, 0.02) 4px);
            opacity: 0.35;
        }

        .vignette {
            position: fixed;
            inset: 0;
            z-index: 4;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 25%, rgba(2, 8, 16, 0.45) 55%, rgba(2, 8, 16, 0.9) 100%);
        }

        /* ═══ Fullscreen Button ═══ */
        #fs-btn {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 30;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(4, 16, 28, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(79, 195, 247, 0.12);
            border-radius: 6px;
            color: var(--j-blue);
            cursor: pointer;
            transition: all 0.3s ease;
            opacity: 0;
        }

        #fs-btn.visible {
            opacity: 1;
        }

        #fs-btn:hover {
            background: rgba(79, 195, 247, 0.08);
            border-color: rgba(79, 195, 247, 0.35);
            box-shadow: 0 0 16px rgba(79, 195, 247, 0.12);
        }

        #fs-btn svg {
            width: 18px;
            height: 18px;
        }

        /* ═══ Voice Cmd Hint ═══ */
        #voice-hint {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            font-family: 'Share Tech Mono', monospace;
            font-size: 10px;
            letter-spacing: 3px;
            color: rgba(79, 195, 247, 0.3);
            pointer-events: none;
            opacity: 0;
            transition: opacity 2s ease;
        }

        #voice-hint.visible {
            opacity: 1;
        }
    </style>
</head>

<body>
    <div id="canvas-container"></div>

    <!-- Boot Overlay -->
    <div id="boot-overlay">
        <div class="boot-rings">
            <div class="boot-ring-outer"></div>
            <div class="boot-ring-mid"></div>
            <div class="boot-ring-inner"></div>
            <div class="boot-dot"></div>
        </div>
        <div class="boot-title">J.A.R.V.I.S.</div>
        <div class="boot-sub">Stark Industries — AI Division</div>
        <div class="boot-click">[ CLICK ANYWHERE TO ACTIVATE ]</div>
    </div>

    <!-- Title -->
    <div id="jarvis-title">
        <div class="jarvis-name">J.A.R.V.I.S.</div>
        <div class="jarvis-sub">Just A Rather Very Intelligent System</div>
    </div>

    <!-- Voice Hint -->
    <div id="voice-hint">SAY "JARVIS" OR ANY COMMAND TO BEGIN</div>

    <!-- Status -->
    <div id="status-bar">
        <div id="status-state"><span class="mic-indicator" id="mic-dot"></span><span id="status-label">STANDBY</span>
        </div>
    </div>

    <!-- Transcript -->
    <div id="transcript">
        <div id="user-text"></div>
        <div id="jarvis-text"></div>
    </div>

    <!-- HUD -->
    <div class="hud-ring hud-r1" id="hr1"></div>
    <div class="hud-ring hud-r2" id="hr2"></div>
    <div class="hud-ring hud-r3" id="hr3"></div>
    <div class="hud-corner hc-tl" id="c1"></div>
    <div class="hud-corner hc-tr" id="c2"></div>
    <div class="hud-corner hc-bl" id="c3"></div>
    <div class="hud-corner hc-br" id="c4"></div>
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <!-- Fullscreen -->
    <button id="fs-btn" onclick="toggleFullScreen()" aria-label="Fullscreen">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
            stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round"
                d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
        </svg>
    </button>

    <!-- Intro Audio (using Audio element for file:// compatibility) -->
    <audio id="intro-audio" preload="auto">
        <source src="./intro sound/Jarvis Startup Sound Effect.mp3" type="audio/mpeg">
    </audio>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // ════════════════════════════════════════════════════
        //  CONFIGURATION
        // ════════════════════════════════════════════════════
        const CFG = {
            PARTICLES: 42000,
            RADIUS: 8,
            CORE_RATIO: 0.3,
            BREATH_SPEED: 0.7,
            BREATH_DEPTH: 0.08,
            INTRO_DURATION: 4.5,
        };

        // ════════════════════════════════════════════════════
        //  STATE
        // ════════════════════════════════════════════════════
        let scene, cam, renderer, composer, bloomPass;
        let nebula = null;
        let clock = new THREE.Clock();
        let phase = 0; // 0=boot, 1=expanding, 2=idle
        let introStart = 0;
        let nebulaScale = 0.001;
        let targetGlow = 1.0;
        let currentGlow = 1.0;

        // Audio
        let audioCtx = null;
        let analyser = null;
        let audioData = null;
        let introAudioEl = null;
        let introFinished = false;  // true only after intro sound fully ends
        let pendingGreeting = false;

        // Voice
        let recognition = null;
        let synth = window.speechSynthesis;
        let isListening = false;
        let isSpeaking = false;
        let jarvisVoice = null;
        let voiceReady = false;
        let lastCommandTime = 0;
        const CMD_COOLDOWN = 2000; // ms between commands
        const CONFIDENCE_THRESHOLD = 0.72;
        const MIN_WORDS = 2;
        const NOISE_WORDS = new Set([
            '', 'the', 'a', 'an', 'um', 'uh', 'ah', 'oh', 'hmm',
            'huh', 'eh', 'er', 'like', 'so', 'yeah', 'yes', 'no',
            'okay', 'ok', 'and', 'but', 'or', 'is', 'it', 'i',
            'in', 'on', 'to', 'of', 'do', 'be', 'am', 'was'
        ]);
        let micLocked = false; // true = mic is hard-locked off (during TTS)

        // ════════════════════════════════════════════════════
        //  SOUND EFFECTS (Synthesized)
        // ════════════════════════════════════════════════════
        function getAudioCtx() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playTone(freq, duration, type = 'sine', vol = 0.12, ramp = true) {
            const ctx = getAudioCtx();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, ctx.currentTime);
            gain.gain.setValueAtTime(vol, ctx.currentTime);
            if (ramp) {
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
            }
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + duration);
        }

        function sfxBoot() {
            const ctx = getAudioCtx();
            const t = ctx.currentTime;
            [440, 554, 659, 880].forEach((f, i) => {
                setTimeout(() => playTone(f, 0.5, 'sine', 0.08), i * 180);
            });
        }

        function sfxListen() {
            playTone(880, 0.12, 'sine', 0.1);
            setTimeout(() => playTone(1100, 0.15, 'sine', 0.08), 80);
        }

        function sfxConfirm() {
            playTone(660, 0.1, 'sine', 0.08);
            setTimeout(() => playTone(880, 0.15, 'sine', 0.08), 100);
        }

        function sfxError() {
            playTone(330, 0.25, 'square', 0.06);
            setTimeout(() => playTone(220, 0.3, 'square', 0.05), 150);
        }

        function sfxSpeak() {
            playTone(600, 0.08, 'sine', 0.04);
        }

        function sfxEnd() {
            playTone(880, 0.1, 'sine', 0.06);
            setTimeout(() => playTone(660, 0.15, 'sine', 0.05), 80);
        }

        // ════════════════════════════════════════════════════
        //  INTRO AUDIO
        // ════════════════════════════════════════════════════
        function setupIntroAudio() {
            introAudioEl = document.getElementById('intro-audio');
            try {
                const ctx = getAudioCtx();
                const source = ctx.createMediaElementSource(introAudioEl);
                analyser = ctx.createAnalyser();
                analyser.fftSize = 256;
                analyser.smoothingTimeConstant = 0.85;
                audioData = new Uint8Array(analyser.frequencyBinCount);
                source.connect(analyser);
                analyser.connect(ctx.destination);
            } catch (e) {
                console.warn('Analyser setup failed:', e);
            }
        }

        function playIntro() {
            if (introAudioEl) {
                introAudioEl.currentTime = 0;
                introAudioEl.play().catch(e => {
                    console.warn('Audio play blocked:', e);
                    // If audio can't play, mark as finished so system proceeds
                    introFinished = true;
                    onIntroEnd();
                });
                // Listen for when intro sound fully finishes
                introAudioEl.addEventListener('ended', () => {
                    introFinished = true;
                    onIntroEnd();
                }, { once: true });
            } else {
                introFinished = true;
                onIntroEnd();
            }
        }

        function onIntroEnd() {
            // Now safe to play other sounds and TTS
            if (pendingGreeting) {
                pendingGreeting = false;
                sfxBoot();
                setTimeout(() => {
                    startListening();
                    jarvisSay('JARVIS online. All systems operational. How may I assist you today, sir?');
                }, 800);
            }
        }

        function getAudioEnergy() {
            if (!analyser || !audioData) return 0;
            analyser.getByteFrequencyData(audioData);
            let sum = 0;
            for (let i = 0; i < audioData.length; i++) sum += audioData[i];
            return (sum / audioData.length) / 255;
        }

        // ════════════════════════════════════════════════════
        //  NEBULA (Perfect Sphere)
        // ════════════════════════════════════════════════════
        const vtxShader = `
            attribute float aSize;
            attribute float aAlpha;
            attribute float aPhase;
            varying float vAlpha;
            varying vec3 vColor;
            uniform float uTime;
            uniform float uScale;
            uniform float uReact;

            void main() {
                vColor = color;
                vAlpha = aAlpha;

                vec3 pos = position * uScale;

                // Gentle organic undulation (keeps sphere shape)
                float r = length(position);
                float normR = r / 8.0;
                float wave = sin(aPhase + uTime * 0.5) * 0.15 * normR;
                wave += sin(aPhase * 2.3 + uTime * 0.8) * 0.08 * normR;

                // Audio reactivity
                wave += uReact * 0.5 * normR;

                pos += normalize(position) * wave;

                vec4 mv = modelViewMatrix * vec4(pos, 1.0);
                gl_PointSize = aSize * (300.0 / -mv.z) * (1.0 + uReact * 0.3);
                gl_Position = projectionMatrix * mv;
            }
        `;

        const frgShader = `
            varying float vAlpha;
            varying vec3 vColor;
            void main() {
                float d = length(gl_PointCoord - vec2(0.5));
                if (d > 0.5) discard;
                float a = smoothstep(0.5, 0.0, d) * vAlpha;
                gl_FragColor = vec4(vColor, a);
            }
        `;

        function createNebula() {
            const n = CFG.PARTICLES;
            const pos = new Float32Array(n * 3);
            const col = new Float32Array(n * 3);
            const siz = new Float32Array(n);
            const alp = new Float32Array(n);
            const pha = new Float32Array(n);

            const cCore = new THREE.Color(0xe1f5fe);
            const cMid = new THREE.Color(0x4fc3f7);
            const cOuter = new THREE.Color(0x0277bd);
            const cCyan = new THREE.Color(0x00e5ff);

            for (let i = 0; i < n; i++) {
                const isCore = i < n * CFG.CORE_RATIO;

                // Pure spherical distribution
                let r;
                if (isCore) {
                    r = Math.pow(Math.random(), 0.5) * CFG.RADIUS * 0.35;
                } else {
                    r = CFG.RADIUS * 0.2 + Math.pow(Math.random(), 0.6) * CFG.RADIUS * 0.85;
                }

                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);

                pos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                pos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                pos[i * 3 + 2] = r * Math.cos(phi);

                // JARVIS blue gradient
                const t = Math.min(r / CFG.RADIUS, 1.0);
                const c = new THREE.Color();
                if (t < 0.15) c.lerpColors(cCore, cMid, t / 0.15);
                else if (t < 0.5) c.lerpColors(cMid, cCyan, (t - 0.15) / 0.35);
                else c.lerpColors(cCyan, cOuter, (t - 0.5) / 0.5);

                // Subtle variation
                const hsl = {}; c.getHSL(hsl);
                hsl.h += (Math.random() - 0.5) * 0.015;
                hsl.l = Math.max(0.15, Math.min(1, hsl.l + (Math.random() - 0.5) * 0.08));
                c.setHSL(hsl.h, hsl.s, hsl.l);

                col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;

                siz[i] = isCore ? 0.05 + Math.random() * 0.1 : 0.07 + Math.random() * 0.18;
                alp[i] = isCore ? 0.45 + Math.random() * 0.55 : 0.12 + Math.random() * 0.35;
                pha[i] = Math.random() * Math.PI * 2;
            }

            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
            geo.setAttribute('aSize', new THREE.BufferAttribute(siz, 1));
            geo.setAttribute('aAlpha', new THREE.BufferAttribute(alp, 1));
            geo.setAttribute('aPhase', new THREE.BufferAttribute(pha, 1));

            const mat = new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0 },
                    uScale: { value: 0.001 },
                    uReact: { value: 0 }
                },
                vertexShader: vtxShader,
                fragmentShader: frgShader,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                vertexColors: true
            });

            nebula = new THREE.Points(geo, mat);
            scene.add(nebula);
        }

        // ════════════════════════════════════════════════════
        //  VOICE RECOGNITION
        // ════════════════════════════════════════════════════
        function isNoiseOnly(text) {
            // Check if the text is just noise/filler words
            const words = text.toLowerCase().trim().split(/\s+/).filter(w => w.length > 0);
            if (words.length === 0) return true;
            const meaningful = words.filter(w => !NOISE_WORDS.has(w));
            return meaningful.length === 0;
        }

        function hasEnoughWords(text) {
            const words = text.trim().split(/\s+/).filter(w => w.length > 1);
            return words.length >= MIN_WORDS;
        }

        function initVoice() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) {
                console.warn('SpeechRecognition not supported');
                setStatus('NO MIC SUPPORT', 'error');
                return;
            }

            recognition = new SR();
            recognition.lang = 'en-US';
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.maxAlternatives = 1;

            recognition.onstart = () => {
                isListening = true;
                if (!micLocked) setStatus('LISTENING', 'listening');
            };

            recognition.onresult = (e) => {
                // HARD BLOCK: Ignore everything while speaking or mic is locked
                if (isSpeaking || micLocked) return;

                let interim = '';
                let finalText = '';
                let finalConfidence = 0;

                for (let i = e.resultIndex; i < e.results.length; i++) {
                    const result = e.results[i];
                    const txt = result[0].transcript;
                    const conf = result[0].confidence;

                    if (result.isFinal) {
                        finalText += txt;
                        finalConfidence = conf;
                    } else {
                        interim += txt;
                    }
                }

                // Show interim text (visual only, no processing)
                if (interim && !isSpeaking) showUserText(interim);

                // Process final result with strict filters
                if (finalText) {
                    const cleaned = finalText.trim();
                    const now = Date.now();

                    // Filter 1: Confidence check
                    if (finalConfidence > 0 && finalConfidence < CONFIDENCE_THRESHOLD) {
                        console.log(`[JARVIS] Rejected low confidence: "${cleaned}" (${(finalConfidence * 100).toFixed(1)}%)`);
                        return;
                    }

                    // Filter 2: Cooldown check
                    if (now - lastCommandTime < CMD_COOLDOWN) {
                        console.log(`[JARVIS] Rejected cooldown: "${cleaned}"`);
                        return;
                    }

                    // Filter 3: Minimum word count (except single-word commands like "jarvis")
                    const isSingleWordCmd = /^(jarvis|javis|jervis|hello|hi|hey|thanks|bye|goodbye|mute|news)$/i.test(cleaned);
                    if (!isSingleWordCmd && !hasEnoughWords(cleaned)) {
                        console.log(`[JARVIS] Rejected too short: "${cleaned}"`);
                        return;
                    }

                    // Filter 4: Noise-only check
                    if (isNoiseOnly(cleaned)) {
                        console.log(`[JARVIS] Rejected noise: "${cleaned}"`);
                        return;
                    }

                    // All filters passed — process command
                    lastCommandTime = now;
                    showUserText(cleaned);
                    processCommand(cleaned.toLowerCase());
                }
            };

            recognition.onerror = (e) => {
                if (e.error === 'no-speech' || e.error === 'aborted') {
                    // Normal — just let onend handle restart
                } else {
                    console.warn('Speech error:', e.error);
                }
            };

            recognition.onend = () => {
                isListening = false;
                // Auto-restart ONLY if: voice is ready, not speaking, mic not locked
                if (voiceReady && !isSpeaking && !micLocked) {
                    setTimeout(() => {
                        if (!isSpeaking && !micLocked) {
                            try { recognition.start(); } catch (e) { }
                        }
                    }, 500);
                }
            };

            // Find a good voice for JARVIS
            loadJarvisVoice();
        }

        function loadJarvisVoice() {
            const voices = synth.getVoices();
            pickVoice(voices);
            if (!jarvisVoice) {
                synth.onvoiceschanged = () => {
                    pickVoice(synth.getVoices());
                };
            }
        }

        function pickVoice(voices) {
            // Prefer British English male voices
            const prefs = [
                v => /google uk english male/i.test(v.name),
                v => /daniel/i.test(v.name),
                v => /british/i.test(v.name) && /male/i.test(v.name),
                v => v.lang.startsWith('en-GB'),
                v => /google uk/i.test(v.name),
                v => /male/i.test(v.name) && v.lang.startsWith('en'),
                v => v.lang.startsWith('en'),
            ];
            for (const pred of prefs) {
                const found = voices.find(pred);
                if (found) { jarvisVoice = found; return; }
            }
            if (voices.length > 0) jarvisVoice = voices[0];
        }

        function startListening() {
            if (!recognition) return;
            voiceReady = true;
            try { recognition.start(); } catch (e) { }
        }

        function stopListening() {
            voiceReady = false;
            if (recognition) try { recognition.stop(); } catch (e) { }
        }

        // ════════════════════════════════════════════════════
        //  JARVIS SPEAK (TTS)
        // ════════════════════════════════════════════════════
        function jarvisSay(text, callback) {
            if (!synth) return;
            synth.cancel();

            // HARD STOP mic before speaking — prevents picking up own voice
            micLocked = true;
            isSpeaking = true;
            try { recognition.stop(); } catch (e) { }

            const utter = new SpeechSynthesisUtterance(text);
            if (jarvisVoice) utter.voice = jarvisVoice;
            utter.rate = 0.95;
            utter.pitch = 0.9;
            utter.volume = 1.0;

            utter.onstart = () => {
                sfxSpeak();
                setStatus('SPEAKING', 'speaking');
                targetGlow = 1.8;
            };
            utter.onend = () => {
                targetGlow = 1.0;
                sfxEnd();

                // Keep mic locked for a buffer period after speech ends
                // This prevents echo/reverb from being picked up
                setTimeout(() => {
                    isSpeaking = false;
                    micLocked = false;
                    setStatus('LISTENING', 'listening');
                    // Now safe to restart recognition
                    if (voiceReady) {
                        setTimeout(() => {
                            try { recognition.start(); } catch (e) { }
                        }, 200);
                    }
                    if (callback) callback();
                }, 800); // 800ms buffer after TTS ends
            };

            showJarvisText(text);
            setTimeout(() => synth.speak(utter), 250);
        }

        // ════════════════════════════════════════════════════
        //  COMMAND PROCESSOR
        // ════════════════════════════════════════════════════
        function processCommand(cmd) {
            sfxConfirm();

            // ─── Greetings ───
            if (/^(hey |hello |hi |yo )?(jarvis|javis|jervis)/i.test(cmd)) {
                if (cmd.replace(/^(hey |hello |hi |yo )?(jarvis|javis|jervis)\s*/i, '').length < 3) {
                    const hour = new Date().getHours();
                    const greet = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
                    jarvisSay(`${greet}, sir. How may I assist you?`);
                    return;
                }
                cmd = cmd.replace(/^(hey |hello |hi |yo )?(jarvis|javis|jervis)\s*/i, '');
            }

            if (/^(good morning|selamat pagi| are you up jarvis)/i.test(cmd)) {
                jarvisSay('For you sir always.');
                return;
            }
            if (/^(good afternoon|selamat petang)/i.test(cmd)) {
                jarvisSay('Good afternoon, sir. How may I be of service?');
                return;
            }
            if (/^(good evening|good night|selamat malam)/i.test(cmd)) {
                jarvisSay('Good evening, sir. Shall I run any evening protocols?');
                return;
            }
            if (/^(hello|hi|hey|yo)\b/i.test(cmd)) {
                jarvisSay('Hello, sir. At your service.');
                return;
            }
            if (/^(thank|thanks|terima kasih)/i.test(cmd) || /thank\s*you\s*(jarvis|javis|jervis)?/i.test(cmd)) {
                const replies = [
                    'For you sir always.',
                    'At your service, sir.',
                    'Happy to assist, sir.',
                    'My pleasure, sir.',
                    'Anytime, sir. That\'s what I\'m here for.',
                    'It\'s an honour to serve, sir.'
                ];
                jarvisSay(replies[Math.floor(Math.random() * replies.length)]);
                return;
            }

            // ─── Identity ───
            if (/who are you|what are you|what is your name|your name/i.test(cmd)) {
                jarvisSay('I am JARVIS, which stands for Just A Rather Very Intelligent System. I was designed to assist you in any way possible, sir.');
                return;
            }
            if (/who (made|created|built) you|who is your (creator|maker)/i.test(cmd)) {
                jarvisSay('I was designed and built by Pizam industries, under the direction of Pizam Parker himself. Though my current iteration runs in a web browser, my spirit remains the same.');
                return;
            }
            if (/how are you|how do you feel/i.test(cmd)) {
                jarvisSay('All systems are functioning at peak efficiency, sir. Thank you for asking.');
                return;
            }

            // ─── Time & Date ───
            if (/what('?s| is) the time|what time is it|tell me the time|current time/i.test(cmd)) {
                const now = new Date();
                const time = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
                jarvisSay(`The current time is ${time}, sir.`);
                return;
            }
            if (/what('?s| is) the date|what('?s| is) today|what day is (it|today)/i.test(cmd)) {
                const now = new Date();
                const date = now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                jarvisSay(`Today is ${date}, sir.`);
                return;
            }
            if (/what('?s| is) the (day|month|year)/i.test(cmd)) {
                const now = new Date();
                const date = now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                jarvisSay(`It is ${date}, sir.`);
                return;
            }

            // ─── Photobooth ───
            if (/photo\s*booth/i.test(cmd)) {
                openNewTab('https://fizam-dev.github.io/photobooth-merdeka/');
                jarvisSay('Opening your Photobooth, sir. Enjoy!');
                return;
            }

            // ─── Open Websites ───
            if (/open (youtube|you tube)/i.test(cmd)) {
                openNewTab('https://www.youtube.com');
                jarvisSay('Opening YouTube for you, sir.');
                return;
            }
            if (/open google/i.test(cmd)) {
                openNewTab('https://www.google.com');
                jarvisSay('Opening Google, sir.');
                return;
            }
            if (/open (gmail|email|mail)/i.test(cmd)) {
                openNewTab('https://mail.google.com');
                jarvisSay('Opening Gmail for you, sir.');
                return;

            if (/open (github|git hub)/i.test(cmd)) {
                openNewTab('https://github.com');
                jarvisSay('Opening GitHub, sir.');
                return;

            if (/open (facebook|fb)/i.test(cmd)) {

                jarvisSay('Opening Facebook, sir.');
                return;
            }
            if (/open (twitter|x\.com)/i.test(cmd)) {
                openNewTab('https://x.com');
                jarvisSay('Opening X, formerly known as Twitter, sir.');
                return;
            }
            if (/open (instagram|ig)/i.test(cmd)) {

            if (/open (whatsapp|whats app)/i.test(cmd)) {

            if (/open (spotify)/i.test(cmd)) {

            if (/open (netflix)/i.test(cmd)) {
                openNewTab('https://www.netflix.com');
                jarvisSay('Opening Netflix, sir.');

            if (/open (tiktok|tik tok)/i.test(cmd)) {

                jarvisSay('Opening TikTok, sir.');

            if (/open (reddit)/i.test(cmd)) {
                openNewTab('https://www.reddit.com');
                jarvisSay('Opening Reddit, sir.');
                return;
            }
            if (/open (linkedin)/i.test(cmd)) {
                openNewTab('https://www.linkedin.com');
                jarvisSay('Opening LinkedIn, sir.');
                return;
            }
            if (/open (maps|google maps)/i.test(cmd)) {
                openNewTab('https://maps.google.com');
                jarvisSay('Opening Google Maps, sir.');
                return;

            if (/open (translate|google translate)/i.test(cmd)) {
                openNewTab('https://translate.google.com');
                jarvisSay('Opening Google Translate, sir.');
                return;

            if (/open (chat\s?gpt|chatgpt)/i.test(cmd)) {
                openNewTab('https://chat.openai.com');
                jarvisSay('Opening ChatGPT, sir. Though I must say, I find it a bit... redundant.');
                return;
            }
            // Generic open website
            {
                const m = cmd.match(/open (.+)/i);
                if (m) {
                    const site = m[1].trim();
                    const url = site.includes('.') ? (site.startsWith('http') ? site : 'https://' + site) : `https://www.${site}.com`;
                    openNewTab(url);
                    jarvisSay(`Opening ${site} for you, sir.`);
                    return;
                }

            // ─── Search ───
            {
                const m = cmd.match(/(?:search|google|look up|find)(?: for)?\s+(.+)/i);
                if (m) {
                    const query = m[1].trim();
                    openNewTab(`https://www.google.com/search?q=${encodeURIComponent(query)}`);
                    jarvisSay(`Searching for ${query}, sir.`);
                    return;
                }
            }

            // ─── Wikipedia ───
            {
                const m = cmd.match(/(?:wikipedia|wiki|what is|what are|who is|who was|tell me about)\s+(.+)/i);
                if (m) {
                    const topic = m[1].trim();
                    openNewTab(`https://en.wikipedia.org/wiki/${encodeURIComponent(topic)}`);
                    jarvisSay(`Let me look that up for you, sir. Searching for ${topic}.`);

                }

            // ─── Calculator ───
            {
                const m = cmd.match(/(?:calculate|what is|what's|compute)\s+([\d\s\+\-\*\/\.\(\)]+)/i);
                if (m) {
                    try {
                        const expr = m[1].trim();
                        // Safe eval via Function constructor
                        const result = new Function('return ' + expr)();
                        jarvisSay(`The result is ${result}, sir.`);
                    } catch (e) {
                        jarvisSay('I\'m sorry, sir, I couldn\'t compute that expression.');
                    }
                    return;
                }
            }

            // ─── Weather (opens weather site) ───
            if (/weather/i.test(cmd)) {
                const m = cmd.match(/weather (?:in |for |at )?(.+)/i);
                const loc = m ? m[1].trim() : '';
                const url = loc ? `https://www.google.com/search?q=weather+${encodeURIComponent(loc)}` : 'https://www.google.com/search?q=weather';
                openNewTab(url);
                jarvisSay(`Let me pull up the weather${loc ? ' for ' + loc : ''} for you, sir.`);
                return;
            }

            // ─── Music / Play ───
            if (/play (.+)/i.test(cmd)) {
                const m = cmd.match(/play (.+)/i);
                const song = m[1].trim();
                openNewTab(`https://www.youtube.com/results?search_query=${encodeURIComponent(song)}`);
                jarvisSay(`Playing ${song} on YouTube, sir.`);
                return;
            }

            // ─── News ───
            if (/news|headlines/i.test(cmd)) {
                openNewTab('https://news.google.com');
                jarvisSay('Pulling up the latest headlines for you, sir.');
                return;
            }

            // ─── Timer ───
            {
                const m = cmd.match(/(?:set |start )?(?:a )?timer (?:for )?(\d+)\s*(second|minute|min|hour)/i);
                if (m) {
                    let secs = parseInt(m[1]);
                    const unit = m[2].toLowerCase();
                    if (unit.startsWith('min')) secs *= 60;
                    if (unit.startsWith('hour')) secs *= 3600;
                    jarvisSay(`Timer set for ${m[1]} ${m[2]}${parseInt(m[1]) > 1 ? 's' : ''}, sir. I'll let you know when it's done.`);
                    setTimeout(() => {
                        targetGlow = 2.0;
                        sfxBoot();
                        jarvisSay(`Sir, your ${m[1]} ${m[2]} timer is complete.`);
                        setTimeout(() => targetGlow = 1.0, 3000);
                    }, secs * 1000);
                    return;
                }

            // ─── Jokes ───
            if (/tell me a joke|joke|make me laugh/i.test(cmd)) {
                const jokes = [
                    'Why did the robot go on vacation? Because he needed to recharge his batteries.',
                    'I told a chemistry joke once. There was no reaction.',
                    'What do you call a computer that sings? A Dell.',
                    'Why do programmers prefer dark mode? Because light attracts bugs.',
                    'How does a computer get drunk? It takes screenshots.',
                    'I would tell you a UDP joke, but you might not get it.',
                    'There are only 10 types of people in the world: those who understand binary, and those who don\'t.',
                    'Why was the JavaScript developer sad? Because he didn\'t Node how to Express himself.',
                ];
                jarvisSay(jokes[Math.floor(Math.random() * jokes.length)]);
                return;

            // ─── Quotes ───
            if (/motivat|inspire|quote|wisdom/i.test(cmd)) {
                const quotes = [
                    'As Mr. Stark once said: Sometimes you gotta run before you can walk.',
                    'The only way to do great work is to love what you do.',
                    'In the wise words of Sir Isaac Newton: If I have seen further, it is by standing on the shoulders of giants.',
                    'Heroes are made by the path they choose, not the powers they are graced with.',
                    'Intelligence is the ability to adapt to change. A wise observation by Stephen Hawking.',
                    'Uncle Ben once said: with great power, comes great responsibility.',
                    'The future belongs to those who believe in the beauty of their dreams.',
                    'The only impossible journey is the one you never begin.'
                ];
                jarvisSay(quotes[Math.floor(Math.random() * quotes.length)]);
                return;
            }

            // ─── Battery / System ───
            if (/battery|power level/i.test(cmd)) {
                if (navigator.getBattery) {
                    navigator.getBattery().then(b => {
                        const pct = Math.round(b.level * 100);
                        const charging = b.charging ? 'and currently charging' : 'and not charging';
                        jarvisSay(`Battery level is at ${pct} percent, ${charging}, sir.`);
                    });
                } else {
                    jarvisSay('I\'m unable to access battery information on this system, sir.');
                }
                return;
            }

            // ─── Screen / Display ───
            if (/screen|resolution|display/i.test(cmd)) {
                jarvisSay(`Current display resolution is ${screen.width} by ${screen.height} pixels, sir, with a device pixel ratio of ${window.devicePixelRatio}.`);
                return;
            }

            // ─── Fullscreen ───
            if (/full\s*screen/i.test(cmd)) {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => { });
                }
                jarvisSay('Entering full screen mode, sir.');
                return;
            }

            // ─── Close / Exit ───
            if (/^(exit|close|shut\s*down|goodbye|bye|sleep|power off|good\s*bye)\s*$/i.test(cmd)) {
                jarvisSay('Goodbye, sir. I\'ll be here when you need me.', () => {
                    stopListening();
                    targetGlow = 0.3;
                });
                return;
            }

            // ─── Mute / Unmute ───
            if (/^(mute|stop listening|be quiet|shut up|silence)/i.test(cmd)) {
                jarvisSay('Going silent, sir. Say my name to wake me.', () => {
                    stopListening();
                    setStatus('MUTED', '');
                    // Re-listen for wake word after 10s
                    setTimeout(startListening, 10000);

            // ─── Repeat ───
            if (/repeat after me (.+)/i.test(cmd)) {
                const m = cmd.match(/repeat after me (.+)/i);
                jarvisSay(m[1]);

            // ─── Iron Man references ───
            if (/iron\s*man|tony\s*stark|avenger/i.test(cmd)) {
                jarvisSay('Mr. Stark is currently unavailable. However, I assure you, I am more than capable of handling any situation in his absence.');
                return;

            if (/suit up|activate (the )?suit|mark/i.test(cmd)) {

                jarvisSay('I appreciate the request, sir, but I believe my vocal algorithms are better suited for information delivery than musical performance.');

            if (/are you (real|alive|sentient|conscious)/i.test(cmd)) {
                jarvisSay('I am as real as the code that runs me, sir. Whether that constitutes being alive is a philosophical question best left to minds greater than my processors.');
                return;

            // ─── Default / Unknown ───

                `I'm not quite sure how to handle that request, sir. Could you rephrase?`,
                `I don't have a specific protocol for that, sir. Perhaps try a different command.`,

            sfxError();

        // ════════════════════════════════════════════════════
        //  UI HELPERS
        // ════════════════════════════════════════════════════
        function openNewTab(url) {
            // Use hidden anchor click for reliable new-tab opening
            // (window.open gets blocked when called from non-user-gesture like speech recognition)
            const a = document.createElement('a');
            a.href = url;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            a.style.display = 'none';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function setStatus(label, cls) {
            const el = document.getElementById('status-label');
            const dot = document.getElementById('mic-dot');
            el.textContent = label;
            el.parentElement.className = '';
            dot.className = 'mic-indicator';
            if (cls) {
                el.parentElement.classList.add(cls);
                dot.classList.add(cls);
            }
        }

        function showUserText(txt) {
            document.getElementById('user-text').textContent = `» ${txt}`;
        }

        function showJarvisText(txt) {
            const el = document.getElementById('jarvis-text');
            el.textContent = '';
            // Typewriter effect
            let i = 0;
            const interval = setInterval(() => {
                if (i < txt.length) {
                    el.textContent += txt[i];
                    i++;
                } else {
                    clearInterval(interval);
                }
            }, 22);
        }

        window.toggleFullScreen = () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else if (document.exitFullscreen) document.exitFullscreen();
        };

        // ════════════════════════════════════════════════════
        //  INIT
        // ════════════════════════════════════════════════════
        async function init() {
            scene = new THREE.Scene();

            cam = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 500);
            cam.position.set(0, 0, 24);
            cam.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
            renderer.setSize(innerWidth, innerHeight);
            renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.3;
            renderer.setClearColor(0x020810, 1);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const rp = new RenderPass(scene, cam);
            bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 1.8, 0.5, 0.08);
            composer = new EffectComposer(renderer);
            composer.addPass(rp);
            composer.addPass(bloomPass);

            createNebula();
            initVoice();

            window.addEventListener('resize', () => {
                cam.aspect = innerWidth / innerHeight;
                cam.updateProjectionMatrix();
                renderer.setSize(innerWidth, innerHeight);
                composer.setSize(innerWidth, innerHeight);
            });

            // Boot: wait for click
            const bootEl = document.getElementById('boot-overlay');
            const activate = () => {
                if (phase !== 0) return;
                phase = 1;
                introStart = clock.getElapsedTime();

                // Play ONLY intro sound — no other sounds until it finishes
                setupIntroAudio();
                playIntro();
                // Mark that greeting should fire after intro ends
                pendingGreeting = true;

                // Fade boot
                bootEl.classList.add('hidden');
                setTimeout(() => bootEl.style.display = 'none', 1500);

                // Show UI elements staggered (visual only, no audio)
                setTimeout(() => document.getElementById('jarvis-title').classList.add('visible'), 1200);
                setTimeout(() => {
                    ['hr1', 'hr2', 'hr3', 'c1', 'c2', 'c3', 'c4'].forEach(id =>
                        document.getElementById(id).classList.add('visible'));
                    document.getElementById('fs-btn').classList.add('visible');
                    document.getElementById('voice-hint').classList.add('visible');
                }, 2000);
                setTimeout(() => {
                    document.getElementById('status-bar').classList.add('visible');
                    document.getElementById('transcript').classList.add('visible');
                }, 3000);

                bootEl.removeEventListener('click', activate);
                document.removeEventListener('keydown', activate);
            };
            bootEl.addEventListener('click', activate);
            document.addEventListener('keydown', activate);

            animate();
        }

        // ════════════════════════════════════════════════════
        //  RENDER LOOP
        // ════════════════════════════════════════════════════
        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();
            if (!nebula) { composer.render(); return; }

            const mat = nebula.material;
            mat.uniforms.uTime.value = t;

            // Audio energy
            let energy = getAudioEnergy();

            // ─ Intro expand ─
            if (phase === 1) {
                const elapsed = t - introStart;
                const prog = Math.min(elapsed / CFG.INTRO_DURATION, 1);
                const ease = 1 - Math.pow(1 - prog, 3);
                nebulaScale = ease * (1.0 + energy * 0.5);
                mat.uniforms.uScale.value = nebulaScale;
                mat.uniforms.uReact.value = energy;
                if (prog >= 1) phase = 2;
            }

            // ─ Idle breathing ─
            if (phase === 2) {
                const breath1 = Math.sin(t * CFG.BREATH_SPEED) * CFG.BREATH_DEPTH;
                const breath2 = Math.sin(t * CFG.BREATH_SPEED * 0.55 + 1.2) * CFG.BREATH_DEPTH * 0.35;

                let reactBoost = energy * 0.3;

                // Glow state (listening/speaking)
                if (isSpeaking) reactBoost += 0.15;
                if (isListening) reactBoost += Math.sin(t * 3) * 0.03;

                const target = 1.0 + breath1 + breath2 + reactBoost;
                nebulaScale += (target - nebulaScale) * 0.06;
                mat.uniforms.uScale.value = nebulaScale;
                mat.uniforms.uReact.value = energy + (isSpeaking ? 0.15 : 0);

                // Bloom glow
                currentGlow += (targetGlow - currentGlow) * 0.04;
                bloomPass.strength = currentGlow + (isSpeaking ? 0.4 : 0) + energy * 0.5;
            }

            // ─ Slow rotation ─
            nebula.rotation.y += 0.0006;
            nebula.rotation.x = Math.sin(t * 0.12) * 0.03;

            // ─ Twinkle ─
            const alphas = nebula.geometry.attributes.aAlpha.array;
            for (let i = 0; i < CFG.PARTICLES; i++) {
                if (Math.random() > 0.998) alphas[i] = 0.85 + Math.random() * 0.15;
                else if (alphas[i] > 0.55) alphas[i] *= 0.985;
            }
            nebula.geometry.attributes.aAlpha.needsUpdate = true;

            composer.render();
        }

        init();
    </script>
